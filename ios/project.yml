name: AegisCompanion
# Build verification trigger.
options:
  bundleIdPrefix: com.aegis
targets:
  AegisCompanion:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    dependencies:
      - package: Kokoro
    sources:
      - AegisCompanion
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aegis.companion
      SWIFT_VERSION: 5.10
    info:
      path: AegisCompanion/Info.plist
      properties:
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "Aegis Companion connects to your approved local Aegis bridge."
packages:
  Kokoro:
    url: https://github.com/mweinbach/kokoro-swift.git
    version: 0.1.0

name: AegisCompanion
options:
  bundleIdPrefix: com.aegis
targets:
  AegisCompanion:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    dependencies:
      - package: KokoroSwift
    sources:
      - AegisCompanion
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aegis.companion
      SWIFT_VERSION: 5.10
    info:
      path: AegisCompanion/Info.plist
      properties:
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "Aegis Companion connects to your approved local Aegis bridge."
packages:
  KokoroSwift:
    url: https://github.com/mlalma/kokoro-ios.git
    version: 1.0.2

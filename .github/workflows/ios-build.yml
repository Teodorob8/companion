name: Aegis Companion iOS build

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - 'project.yml'

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build for iOS Simulator
        working-directory: ios
        run: >-
          xcodebuild build
          -project AegisCompanion.xcodeproj
          -scheme AegisCompanion
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,name=iPhone 16'
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
      - name: Package simulator app
        working-directory: ios
        run: ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/AegisCompanion.app AegisCompanion-Simulator.zip
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: AegisCompanion-Simulator
          path: ios/AegisCompanion-Simulator.zip
